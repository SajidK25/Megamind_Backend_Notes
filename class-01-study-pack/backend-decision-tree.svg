<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #33322e; stroke-width: 1.5; }
    .sub { font-size: 13px; fill: #33322e; }
    .num { font-size: 13px; fill: #d97a3b; font-weight: bold; }
    .result { font-size: 14px; font-weight: bold; fill: #33322e; }
  </style>
  <rect class="box" x="30" y="20" width="740" height="34" rx="6"/>
  <text class="num" x="45" y="42">1</text>
  <text class="sub" x="70" y="42">Do two different people need to see the same thing?</text>

  <rect class="box" x="30" y="64" width="740" height="34" rx="6"/>
  <text class="num" x="45" y="86">2</text>
  <text class="sub" x="70" y="86">Must the data survive a lost or wiped device?</text>

  <rect class="box" x="30" y="108" width="740" height="34" rx="6"/>
  <text class="num" x="45" y="130">3</text>
  <text class="sub" x="70" y="130">Is there a secret the user must never hold?</text>

  <rect class="box" x="30" y="152" width="740" height="34" rx="6"/>
  <text class="num" x="45" y="174">4</text>
  <text class="sub" x="70" y="174">Does something need to happen while nobody has the app open?</text>

  <rect class="box" x="30" y="196" width="740" height="34" rx="6"/>
  <text class="num" x="45" y="218">5</text>
  <text class="sub" x="70" y="218">Do we need to change behaviour without shipping an update?</text>

  <text class="result" x="30" y="270">One "yes" → we need a backend.</text>
  <text class="result" x="30" y="295">Five "no"s → we do not.</text>
</svg>
