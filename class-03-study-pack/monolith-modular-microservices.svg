<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>Monolith, modular monolith and microservices</title>
<desc>Three arrangements side by side. A monolith is one deploy containing orders, billing and users over one database, where a call between features is a function call. A modular monolith is still one deploy, but each feature is walled and exposes a single index entry point. Microservices are three deploys with three databases, calling each other over HTTP; an arrow showing one service reading another service's database is crossed out and labelled never this.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#3C3489}
.th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.ml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5F5E5A}
.mw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#B3451F}
.mk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;fill:#3C3489}
.hostbox{fill:#EEEDFE;stroke:#7F77DD}
.rtbox{fill:#F1EFE8;stroke:#888780}
.svbox{fill:#E1F5EE;stroke:#1D9E75}
.wire{stroke:#B4B2A9}
.bad{stroke:#D85A30}
.panel{fill:#F1EFE8}
.db{fill:none;stroke:#888780}
@media (prefers-color-scheme:dark){
.t{fill:#CECBF6}.th{fill:#EDEDE8}.ts{fill:#B4B2A9}.ml{fill:#B4B2A9}.mw{fill:#EE9A6E}.mk{fill:#AFA9EC}
.hostbox{fill:#3C3489;stroke:#AFA9EC}.rtbox{fill:#2C2C2A;stroke:#B4B2A9}.svbox{fill:#085041;stroke:#5DCAA5}
.wire{stroke:#5F5E5A}.bad{stroke:#EE9A6E}.panel{fill:#262624}.db{stroke:#B4B2A9}}
</style>

<!-- 1. monolith -->
<text class="th" x="24" y="28">Monolith</text>
<text class="ts" x="24" y="47">one codebase · one deploy</text>
<rect class="rtbox" x="24" y="60" width="180" height="150" rx="10" stroke-width="0.5"/>
<rect class="hostbox" x="42" y="78" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="114" y="98" text-anchor="middle">orders</text>
<rect class="hostbox" x="42" y="118" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="114" y="138" text-anchor="middle">billing</text>
<rect class="hostbox" x="42" y="158" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="114" y="178" text-anchor="middle">users</text>
<path d="M114 108 L114 118 M110 114 l4 4 4 -4" class="wire" fill="none" stroke-width="0.5"/>
<path d="M114 148 L114 158 M110 154 l4 4 4 -4" class="wire" fill="none" stroke-width="0.5"/>
<line x1="114" y1="210" x2="114" y2="238" class="wire" stroke-width="0.5"/>
<ellipse class="db" cx="114" cy="246" rx="30" ry="8" stroke-width="0.5"/>
<path class="db" d="M84 246 v22 a30 8 0 0 0 60 0 v-22" fill="none" stroke-width="0.5"/>
<text class="ts" x="114" y="292" text-anchor="middle">one database</text>
<text class="mk" x="114" y="316" text-anchor="middle">billing.charge(order)</text>
<text class="ts" x="114" y="334" text-anchor="middle">a function call</text>

<!-- 2. modular monolith -->
<text class="th" x="250" y="28">Modular monolith</text>
<text class="ts" x="250" y="47">one deploy · walled modules</text>
<rect class="rtbox" x="250" y="60" width="180" height="150" rx="10" stroke-width="0.5"/>
<rect class="hostbox" x="268" y="78" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="290" y="98">orders</text>
<text class="mk" x="404" y="98" text-anchor="end">index.ts</text>
<rect class="hostbox" x="268" y="118" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="290" y="138">billing</text>
<text class="mk" x="404" y="138" text-anchor="end">index.ts</text>
<rect class="hostbox" x="268" y="158" width="144" height="30" rx="6" stroke-width="0.5"/>
<text class="t" x="290" y="178">users</text>
<text class="mk" x="404" y="178" text-anchor="end">index.ts</text>
<line x1="340" y1="210" x2="340" y2="238" class="wire" stroke-width="0.5"/>
<ellipse class="db" cx="340" cy="246" rx="30" ry="8" stroke-width="0.5"/>
<path class="db" d="M310 246 v22 a30 8 0 0 0 60 0 v-22" fill="none" stroke-width="0.5"/>
<text class="ts" x="340" y="292" text-anchor="middle">still one database</text>
<text class="mk" x="340" y="316" text-anchor="middle">import { charge } from '../billing'</text>
<text class="ts" x="340" y="334" text-anchor="middle">one door per module · still a function call</text>

<!-- 3. microservices -->
<text class="th" x="474" y="28">Microservices</text>
<text class="ts" x="474" y="47">many codebases · many deploys</text>

<rect class="svbox" x="474" y="60" width="82" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="515" y="82" text-anchor="middle">orders</text>
<rect class="svbox" x="574" y="60" width="82" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="615" y="82" text-anchor="middle">billing</text>

<line x1="556" y1="77" x2="574" y2="77" class="wire" stroke-width="0.5"/>
<text class="ts" x="565" y="66" text-anchor="middle">HTTP</text>

<line x1="515" y1="94" x2="515" y2="122" class="wire" stroke-width="0.5"/>
<ellipse class="db" cx="515" cy="130" rx="26" ry="7" stroke-width="0.5"/>
<path class="db" d="M489 130 v20 a26 7 0 0 0 52 0 v-20" fill="none" stroke-width="0.5"/>
<line x1="615" y1="94" x2="615" y2="122" class="wire" stroke-width="0.5"/>
<ellipse class="db" cx="615" cy="130" rx="26" ry="7" stroke-width="0.5"/>
<path class="db" d="M589 130 v20 a26 7 0 0 0 52 0 v-20" fill="none" stroke-width="0.5"/>
<text class="ts" x="515" y="174" text-anchor="middle">its own DB</text>
<text class="ts" x="615" y="174" text-anchor="middle">its own DB</text>

<!-- the forbidden arrow -->
<path d="M540 96 L600 140" class="bad" stroke-width="0.5" stroke-dasharray="4 3" fill="none"/>
<path d="M562 110 l14 14 M576 110 l-14 14" class="bad" stroke-width="1.2"/>
<text class="mw" x="524" y="200">never this: reading another service's tables</text>

<rect class="panel" x="474" y="212" width="182" height="122" rx="10"/>
<text class="th" x="490" y="236">A network call can</text>
<text class="ts" x="490" y="258">· be slow, or time out</text>
<text class="ts" x="490" y="276">· arrive twice</text>
<text class="ts" x="490" y="294">· never arrive at all</text>
<text class="ts" x="490" y="318">Every one is code you write.</text>

<!-- animated call travelling in each shape -->
<g>
  <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
    keyTimes="0;0.4;0.5;0.9;1" values="108,110; 108,150; 108,150; 108,110; 108,110"/>
  <circle r="4" fill="#7F77DD"/>
</g>
<g>
  <animateTransform attributeName="transform" type="translate" dur="5s" begin="0.6s" repeatCount="indefinite"
    keyTimes="0;0.4;0.5;0.9;1" values="334,110; 334,150; 334,150; 334,110; 334,110"/>
  <circle r="4" fill="#7F77DD"/>
</g>
<g>
  <animateTransform attributeName="transform" type="translate" dur="5s" begin="1.2s" repeatCount="indefinite"
    keyTimes="0;0.45;0.55;1" values="556,77; 574,77; 574,77; 556,77"/>
  <circle r="4" fill="#1D9E75">
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.45;0.5;0.9;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
</g>

<rect class="panel" x="24" y="352" width="406" height="36" rx="10"/>
<text class="ts" x="40" y="375">The axis is deployment, not directories. If two things must ship together, they are one unit.</text>
</svg>
