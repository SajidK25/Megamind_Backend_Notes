<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Four shapes of a backend</title>
<style>
  :root {
    --bg: #faf9f5; --ink: #33322e; --sub: #6b6a66; --accent: #d97a3b; --line: #d8d5cc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    margin: 0; padding: 40px 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.intro { color: var(--sub); margin-top: 0; max-width: 600px; text-align: center; }
  .tabs { display: flex; gap: 10px; margin: 24px 0; flex-wrap: wrap; justify-content: center; }
  .tab {
    padding: 10px 18px; border: 2px solid var(--line); border-radius: 8px;
    background: white; cursor: pointer; font-size: 14px; color: var(--sub);
  }
  .tab.active { border-color: var(--accent); color: var(--accent); background: #fdf1e7; font-weight: bold; }
  .stage-wrap {
    border: 2px solid var(--ink); border-radius: 10px; padding: 30px;
    max-width: 700px; width: 100%; background: white;
  }
  .diagram {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    flex-wrap: wrap; margin: 20px 0; min-height: 90px;
  }
  .node {
    border: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px;
    font-size: 13px; text-align: center; background: white; opacity: 0;
    animation: pop 0.4s ease forwards;
  }
  .node.accent { border-color: var(--accent); background: #fdf1e7; }
  .arrow { font-size: 22px; color: var(--accent); opacity: 0; animation: pop 0.4s ease forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .node:nth-child(1), .arrow:nth-child(1) { animation-delay: 0s; }
  .node:nth-child(2), .arrow:nth-child(2) { animation-delay: 0.15s; }
  .node:nth-child(3), .arrow:nth-child(3) { animation-delay: 0.3s; }
  .node:nth-child(4), .arrow:nth-child(4) { animation-delay: 0.45s; }
  h2 { font-size: 18px; margin-bottom: 6px; }
  p.desc { color: var(--sub); line-height: 1.5; }
  .badge { font-size: 11px; font-weight: bold; color: var(--accent); letter-spacing: 0.05em; }
</style>
</head>
<body>
  <h1>Four shapes of a backend</h1>
  <p class="intro">There's no single "web server → application server" architecture. Click through the four shapes and watch the request path change.</p>

  <div class="tabs" id="tabs"></div>

  <div class="stage-wrap">
    <div class="badge" id="badge"></div>
    <h2 id="title"></h2>
    <div class="diagram" id="diagram"></div>
    <p class="desc" id="desc"></p>
  </div>

<script>
  const shapes = [
    {
      letter: "A", title: "Just files",
      badge: "SHAPE A — STATIC",
      path: [["Browser", false], ["Nginx", true], ["HTML · CSS · JS", false]],
      desc: "A static site. Nginx serves the files itself. No application server anywhere."
    },
    {
      letter: "B", title: "Proxy to an HTTP app",
      badge: "SHAPE B — HTTP PROXY",
      path: [["Browser", false], ["Nginx", true], ["Node.js", false]],
      desc: "The backend speaks HTTP and Nginx just forwards. Node, Gunicorn, Uvicorn, and Laravel Octane all live here."
    },
    {
      letter: "C", title: "Bridge protocol",
      badge: "SHAPE C — FASTCGI",
      path: [["Browser", false], ["Nginx", true], ["PHP-FPM", false]],
      desc: "The thing behind Nginx does not speak HTTP at all. A bridge protocol such as FastCGI carries the request to the runtime."
    },
    {
      letter: "D", title: "No front door",
      badge: "SHAPE D — DIRECT",
      path: [["Browser", false], ["Node.js :3000", true]],
      desc: "The app listens on a public port itself, with no Nginx in front. uvicorn+FastAPI and Kestrel+ASP.NET often run this way too."
    }
  ];

  let current = 0;
  const tabsEl = document.getElementById('tabs');
  const badgeEl = document.getElementById('badge');
  const titleEl = document.getElementById('title');
  const diagramEl = document.getElementById('diagram');
  const descEl = document.getElementById('desc');

  shapes.forEach((s, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.textContent = s.letter + ' — ' + s.title;
    tab.addEventListener('click', () => { current = i; render(); });
    tabsEl.appendChild(tab);
  });

  function render() {
    const s = shapes[current];
    [...tabsEl.children].forEach((t, i) => t.classList.toggle('active', i === current));
    badgeEl.textContent = s.badge;
    titleEl.textContent = s.title;
    descEl.textContent = s.desc;

    diagramEl.innerHTML = '';
    s.path.forEach((node, i) => {
      if (i > 0) {
        const arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        diagramEl.appendChild(arrow);
      }
      const el = document.createElement('div');
      el.className = 'node' + (node[1] ? ' accent' : '');
      el.textContent = node[0];
      diagramEl.appendChild(el);
    });
  }

  render();
</script>
</body>
</html>
