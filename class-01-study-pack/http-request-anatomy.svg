<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #d97a3b; stroke-width: 2; }
    .code { font-family: monospace; font-size: 13px; fill: #33322e; }
    .label { font-size: 12px; fill: #6b6a66; }
    .line { stroke: #6b6a66; stroke-width: 1; }
  </style>
  <rect class="box" x="20" y="20" width="440" height="120" rx="4"/>
  <text class="code" x="35" y="45">POST /v1/messages HTTP/1.1</text>
  <text class="code" x="35" y="65">Host: api.chatapp.com</text>
  <text class="code" x="35" y="85">Authorization: Bearer eyJhbGciOi…</text>
  <text class="code" x="35" y="105">Content-Type: application/json</text>
  <text class="code" x="35" y="130">{ "to": "ayesha", "text": "on my way" }</text>

  <line class="line" x1="460" y1="45" x2="500" y2="45"/>
  <text class="label" x="510" y="50">THE VERB — what should happen</text>

  <line class="line" x1="460" y1="65" x2="500" y2="65"/>
  <text class="label" x="510" y="70">THE ADDRESS — which thing</text>

  <line class="line" x1="460" y1="85" x2="500" y2="85"/>
  <text class="label" x="510" y="90">THE PROOF — who is allowed</text>

  <line class="line" x1="460" y1="130" x2="500" y2="130"/>
  <text class="label" x="510" y="135">THE PAYLOAD — the actual stuff</text>
</svg>
