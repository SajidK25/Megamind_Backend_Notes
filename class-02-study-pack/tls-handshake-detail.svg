<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>The TLS 1.3 handshake, message by message</title>
<desc>ClientHello with SNI and the client's key share, ServerHello with the certificate and the server's key share, certificate verification, Finished, and then encrypted application data. The shared key itself is never transmitted.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#3C3489}
.th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.tt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#085041}
.tts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#1D9E75}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#2C2C2A}
.ml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5F5E5A}
.hostbox{fill:#EEEDFE;stroke:#7F77DD}
.svbox{fill:#E1F5EE;stroke:#1D9E75}
.wire{stroke:#B4B2A9}
.panel{fill:#F1EFE8}
.arrow{stroke:#7F77DD}
.arrowg{stroke:#1D9E75}
.enc{fill:#1D9E75}
@media (prefers-color-scheme:dark){
.t{fill:#CECBF6}.th{fill:#EDEDE8}.ts{fill:#B4B2A9}.tt{fill:#9FE1CB}.tts{fill:#5DCAA5}
.m{fill:#EDEDE8}.ml{fill:#B4B2A9}
.hostbox{fill:#3C3489;stroke:#AFA9EC}.svbox{fill:#085041;stroke:#5DCAA5}
.wire{stroke:#5F5E5A}.panel{fill:#262624}
.arrow{stroke:#AFA9EC}.arrowg{stroke:#5DCAA5}.enc{fill:#5DCAA5}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker>
</defs>

<rect class="hostbox" x="40" y="24" width="150" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="115" y="49" text-anchor="middle">Browser</text>
<rect class="svbox" x="490" y="24" width="150" height="40" rx="8" stroke-width="0.5"/>
<text class="tt" x="565" y="49" text-anchor="middle">Server</text>

<line x1="115" y1="64" x2="115" y2="330" class="wire" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="565" y1="64" x2="565" y2="330" class="wire" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- 1 ClientHello -->
<g opacity="0"><animate attributeName="opacity" values="0;1;1;1;1;1" keyTimes="0;0.08;0.3;0.6;0.9;1" dur="14s" repeatCount="indefinite"/>
<line x1="115" y1="100" x2="565" y2="100" class="arrow" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="th" x="130" y="94">1 · ClientHello</text>
<text class="ml" x="130" y="116">product.com (SNI) · TLS 1.3 · ciphers · my key half</text>
</g>

<!-- 2 ServerHello -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.22;0.3;0.6;0.9;1" dur="14s" repeatCount="indefinite"/>
<line x1="565" y1="158" x2="115" y2="158" class="arrow" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="th" x="550" y="152" text-anchor="end">2 · ServerHello</text>
<text class="ml" x="550" y="174" text-anchor="end">chosen cipher · certificate chain · my key half</text>
</g>

<!-- shared key computed -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.36;0.44;0.6;0.9;1" dur="14s" repeatCount="indefinite"/>
<rect class="panel" x="150" y="188" width="380" height="26" rx="8"/>
<text class="tts" x="340" y="206" text-anchor="middle">both sides now compute the same key · from here everything is encrypted</text>
</g>

<!-- 3 verify -->
<g opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.44;0.5;0.56;0.9;1" dur="14s" repeatCount="indefinite"/>
<line x1="115" y1="248" x2="565" y2="248" class="arrowg" stroke-width="1.5" marker-end="url(#ahg)"/>
<text class="th" x="130" y="242">3 · certificate checked</text>
<text class="ml" x="130" y="264">chain · hostname · dates · signature proving the private key</text>
</g>

<!-- 4 finished -->
<g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.56;0.62;0.66;0.72;1" dur="14s" repeatCount="indefinite"/>
<line x1="565" y1="298" x2="115" y2="298" class="arrowg" stroke-width="1.5" marker-end="url(#ahg)"/>
<text class="th" x="550" y="292" text-anchor="end">4 · Finished · then GET / HTTP/1.1</text>
<text class="ml" x="550" y="314" text-anchor="end">a MAC over the whole transcript, then encrypted application data</text>
</g>

<rect class="panel" x="40" y="336" width="600" height="30" rx="8"/>
<text class="ts" x="340" y="356" text-anchor="middle">The shared key is never sent. Someone recording every packet sees both public halves and still cannot compute it.</text>
</svg>
