<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>What the browser receives: MPA, SPA and hybrid</title>
<desc>Three columns showing the first HTTP response in each rendering mode. MPA delivers a complete list and needs no JavaScript. SPA delivers an empty root div and a script tag, then fetches JSON before anything appears. Hybrid delivers the filled list plus an embedded data payload and a script, after which JavaScript hydrates the server-made markup. A panel notes that empty root means the browser builds everything and filled root means the server did it once.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#3C3489}
.th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.ml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#5F5E5A}
.mk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#3C3489}
.mg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#085041}
.mw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#B3451F}
.code{fill:#F1EFE8;stroke:#B4B2A9}
.panel{fill:#F1EFE8}
.wire{stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.t{fill:#CECBF6}.th{fill:#EDEDE8}.ts{fill:#B4B2A9}.ml{fill:#B4B2A9}.mk{fill:#AFA9EC}.mg{fill:#5DCAA5}.mw{fill:#EE9A6E}
.code{fill:#262624;stroke:#5F5E5A}.panel{fill:#262624}.wire{stroke:#5F5E5A}}
</style>

<text class="th" x="24" y="26">MPA</text>
<text class="ts" x="24" y="44">server makes the HTML · JS never takes over</text>
<rect class="code" x="24" y="56" width="202" height="126" rx="8" stroke-width="0.5"/>
<text class="ml" x="38" y="76">&lt;!-- GET /orders --&gt;</text>
<text class="mk" x="38" y="94">&lt;ul&gt;</text>
<text class="mk" x="38" y="112">  &lt;li&gt;#1042 · 1,200&lt;/li&gt;</text>
<text class="mk" x="38" y="130">  &lt;li&gt;#1043 · 890&lt;/li&gt;</text>
<text class="mk" x="38" y="148">&lt;/ul&gt;</text>
<text class="mg" x="38" y="170">full page. no JS needed.</text>

<text class="th" x="248" y="26">SPA</text>
<text class="ts" x="248" y="44">browser makes the HTML</text>
<rect class="code" x="248" y="56" width="202" height="126" rx="8" stroke-width="0.5"/>
<text class="ml" x="262" y="76">&lt;!-- GET / --&gt;</text>
<text class="mw" x="262" y="94">&lt;div id="root"&gt;&lt;/div&gt;</text>
<text class="mk" x="262" y="112">&lt;script src="/app.js"&gt;</text>
<text class="ml" x="262" y="134">// then, in the browser</text>
<text class="mk" x="262" y="152">createRoot(root).render()</text>
<text class="mk" x="262" y="170">await fetch('/api/orders')</text>

<text class="th" x="472" y="26">Hybrid</text>
<text class="ts" x="472" y="44">server makes it · JS takes over</text>
<rect class="code" x="472" y="56" width="184" height="126" rx="8" stroke-width="0.5"/>
<text class="ml" x="486" y="76">&lt;!-- GET /orders --&gt;</text>
<text class="mk" x="486" y="94">&lt;div id="root"&gt;</text>
<text class="mg" x="486" y="112">  &lt;ul&gt;&lt;li&gt;#1042&lt;/li&gt;&lt;/ul&gt;</text>
<text class="mk" x="486" y="130">&lt;/div&gt;</text>
<text class="mw" x="486" y="148">&lt;script&gt;__DATA__={…}</text>
<text class="mk" x="486" y="170">hydrateRoot(root, App)</text>

<!-- timelines -->
<text class="ts" x="24" y="212">what the user sees, over time</text>
<line x1="24" y1="224" x2="656" y2="224" class="wire" stroke-width="0.5" stroke-dasharray="3 4"/>

<rect class="code" x="24" y="234" width="202" height="52" rx="8" stroke-width="0.5"/>
<rect x="36" y="248" width="120" height="10" rx="3" fill="#1D9E75"/>
<text class="ts" x="164" y="257">content</text>
<text class="ts" x="36" y="278">one response · done</text>

<rect class="code" x="248" y="234" width="202" height="52" rx="8" stroke-width="0.5"/>
<rect x="260" y="248" width="46" height="10" rx="3" fill="#B4B2A9"/>
<rect x="308" y="248" width="42" height="10" rx="3" fill="#D85A30"/>
<rect x="352" y="248" width="60" height="10" rx="3" fill="#1D9E75"/>
<text class="ts" x="260" y="278">shell · bundle · fetch · content</text>

<rect class="code" x="472" y="234" width="184" height="52" rx="8" stroke-width="0.5"/>
<rect x="484" y="248" width="76" height="10" rx="3" fill="#1D9E75"/>
<rect x="562" y="248" width="72" height="10" rx="3" fill="#D85A30"/>
<text class="ts" x="484" y="278">content · then hydration</text>
<text class="mw" x="566" y="302">looks ready,</text>
<text class="mw" x="566" y="316">not clickable</text>

<!-- animated progress marker -->
<g>
  <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
    values="24,230; 656,230; 656,230" keyTimes="0;0.85;1"/>
  <line x1="0" y1="0" x2="0" y2="62" stroke="#7F77DD" stroke-width="1"/>
</g>

<rect class="panel" x="24" y="326" width="632" height="62" rx="10"/>
<text class="th" x="42" y="350">Look at #root. Empty means the browser builds everything. Filled means the server did it once.</text>
<text class="ts" x="42" y="372">Two questions, not one: where was the HTML made, and does JavaScript take over afterwards?</text>
</svg>
