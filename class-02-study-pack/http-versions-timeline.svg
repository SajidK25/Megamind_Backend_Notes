<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img">
<title>The same three requests under HTTP/1.0, 1.1, 2 and 3</title>
<desc>A timeline in round trips showing setup cost and transfer for three requests: nine round trips under HTTP/1.0, five under 1.1, three under HTTP/2 and two under HTTP/3.</desc>
<style>
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.tb{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#2C2C2A}
.tp{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;font-weight:500;fill:#993C1D}
.mv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#5F5E5A}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5F5E5A}
.pill{fill:none;stroke:#B4B2A9}
.hl{fill:#EEEDFE;stroke:#7F77DD}
.setup{fill:#FBEED9;stroke:#D8A03D}
.work{fill:#E1F5EE;stroke:#1D9E75}
.axis{stroke:#B4B2A9}
.fin{stroke:#D85A30}
@media (prefers-color-scheme:dark){
.ts{fill:#B4B2A9}.tb{fill:#EDEDE8}.tp{fill:#F0997B}.mv{fill:#B4B2A9}.m{fill:#B4B2A9}
.pill{stroke:#5F5E5A}.hl{fill:#3C3489;stroke:#AFA9EC}
.setup{fill:#854F0B;stroke:#FAC775}.work{fill:#085041;stroke:#5DCAA5}
.axis{stroke:#5F5E5A}.fin{stroke:#F0997B}}
</style>

<rect class="pill" x="45" y="34" width="140" height="36" rx="18" stroke-width="0.5"/>
<rect class="pill" x="195" y="34" width="140" height="36" rx="18" stroke-width="0.5"/>
<rect class="pill" x="345" y="34" width="140" height="36" rx="18" stroke-width="0.5"/>
<rect class="pill" x="495" y="34" width="140" height="36" rx="18" stroke-width="0.5"/>
<rect class="hl" x="45" y="34" width="140" height="36" rx="18" stroke-width="1.5">
<animate attributeName="x" calcMode="discrete" values="45;195;345;495" keyTimes="0;0.25;0.5;0.75" dur="20s" repeatCount="indefinite"/></rect>
<text class="mv" x="115" y="57" text-anchor="middle">HTTP/1.0</text>
<text class="mv" x="265" y="57" text-anchor="middle">HTTP/1.1</text>
<text class="mv" x="415" y="57" text-anchor="middle">HTTP/2</text>
<text class="mv" x="565" y="57" text-anchor="middle">HTTP/3</text>

<text class="m" x="84" y="167" text-anchor="end">req 1</text>
<text class="m" x="84" y="197" text-anchor="end">req 2</text>
<text class="m" x="84" y="227" text-anchor="end">req 3</text>

<g>
<rect class="setup" x="90" y="150" width="88" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="178" y="150" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="setup" x="222" y="180" width="88" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="310" y="180" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="setup" x="354" y="210" width="88" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="442" y="210" width="44" height="24" rx="4" stroke-width="0.5"/>
<line class="fin" x1="486" y1="144" x2="486" y2="240" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="tp" x="60" y="292">A whole new connection and TLS handshake for every single file.</text>
<text class="tb" x="60" y="314">Three files cost nine round trips. This is why old sites felt slow on bad links.</text>
<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.25" dur="20s" repeatCount="indefinite"/></g>

<g opacity="0">
<rect class="setup" x="90" y="150" width="88" height="84" rx="4" stroke-width="0.5"/>
<rect class="work" x="178" y="150" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="222" y="180" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="266" y="210" width="44" height="24" rx="4" stroke-width="0.5"/>
<line class="fin" x1="310" y1="144" x2="310" y2="240" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="tp" x="60" y="292">The connection is reused — but only one request may be in flight at a time.</text>
<text class="tb" x="60" y="314">Setup is paid once. A slow reply still blocks everything queued behind it.</text>
<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.5" dur="20s" repeatCount="indefinite"/></g>

<g opacity="0">
<rect class="setup" x="90" y="150" width="88" height="84" rx="4" stroke-width="0.5"/>
<rect class="work" x="178" y="150" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="178" y="180" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="178" y="210" width="44" height="24" rx="4" stroke-width="0.5"/>
<line class="fin" x1="222" y1="144" x2="222" y2="240" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="tp" x="60" y="292">Multiplexing: all three travel at once over one connection.</text>
<text class="tb" x="60" y="314">A slow reply no longer blocks the others — as long as no packet is lost.</text>
<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.75" dur="20s" repeatCount="indefinite"/></g>

<g opacity="0">
<rect class="setup" x="90" y="150" width="44" height="84" rx="4" stroke-width="0.5"/>
<rect class="work" x="134" y="150" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="134" y="180" width="44" height="24" rx="4" stroke-width="0.5"/>
<rect class="work" x="134" y="210" width="44" height="24" rx="4" stroke-width="0.5"/>
<line class="fin" x1="178" y1="144" x2="178" y2="240" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="tp" x="60" y="292">QUIC folds TLS into the transport, so setup is one round trip, not two.</text>
<text class="tb" x="60" y="314">Same multiplexing, cheaper start, and a lost packet stalls only its own stream.</text>
<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.75" dur="20s" repeatCount="indefinite"/></g>

<line class="axis" x1="90" y1="250" x2="620" y2="250" stroke-width="0.5"/>
<line class="axis" x1="90" y1="246" x2="90" y2="254" stroke-width="0.5"/>
<line class="axis" x1="178" y1="246" x2="178" y2="254" stroke-width="0.5"/>
<line class="axis" x1="266" y1="246" x2="266" y2="254" stroke-width="0.5"/>
<line class="axis" x1="354" y1="246" x2="354" y2="254" stroke-width="0.5"/>
<line class="axis" x1="442" y1="246" x2="442" y2="254" stroke-width="0.5"/>
<line class="axis" x1="530" y1="246" x2="530" y2="254" stroke-width="0.5"/>
<text class="m" x="90" y="268" text-anchor="middle">0</text>
<text class="m" x="178" y="268" text-anchor="middle">2</text>
<text class="m" x="266" y="268" text-anchor="middle">4</text>
<text class="m" x="354" y="268" text-anchor="middle">6</text>
<text class="m" x="442" y="268" text-anchor="middle">8</text>
<text class="m" x="530" y="268" text-anchor="middle">10</text>
<text class="ts" x="620" y="268" text-anchor="end">round trips</text>
<text class="ts" x="340" y="344" text-anchor="middle">amber = connection and TLS setup · green = your actual requests · dashed line = finished</text>
</svg>
