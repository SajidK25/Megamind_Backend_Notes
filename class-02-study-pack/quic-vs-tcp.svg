<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>QUIC compared with the TCP and TLS stack</title>
<desc>HTTP/2 sits on separate TLS and TCP layers and is identified by the five-tuple, so changing network kills it. HTTP/3 sits on QUIC, which folds TLS in, needs one round trip, and is identified by a connection ID that survives a network change.</desc>
<style>
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.tb{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:#2C2C2A}
.th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.tp{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;font-weight:500;fill:#993C1D}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#2C2C2A}
.lay{fill:#F1EFE8;stroke:#B4B2A9}.layt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#2C2C2A}
.quic{fill:#E1F5EE;stroke:#1D9E75}.quict{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#085041}
.panel{fill:#F1EFE8}
.okp{fill:#EAF3DE;stroke:#639922}.okt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3B6D11}
.badp{fill:#FCEBEB;stroke:#E24B4A}.badt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#A32D2D}
@media (prefers-color-scheme:dark){
.ts{fill:#B4B2A9}.tb{fill:#EDEDE8}.th{fill:#EDEDE8}.tp{fill:#F0997B}.m{fill:#EDEDE8}
.lay{fill:#2C2C2A;stroke:#5F5E5A}.layt{fill:#EDEDE8}
.quic{fill:#085041;stroke:#5DCAA5}.quict{fill:#9FE1CB}.panel{fill:#262624}
.okp{fill:#27500A;stroke:#97C459}.okt{fill:#C0DD97}.badp{fill:#791F1F;stroke:#F09595}.badt{fill:#F7C1C1}}
</style>

<text class="th" x="175" y="40" text-anchor="middle">HTTP/2 over TCP</text>
<text class="th" x="505" y="40" text-anchor="middle">HTTP/3 over QUIC</text>

<rect class="lay" x="60" y="56" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="175" y="76" text-anchor="middle">HTTP/2 · streams and frames</text>
<rect class="lay" x="60" y="90" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="175" y="110" text-anchor="middle">TLS 1.3 · encryption</text>
<rect class="lay" x="60" y="124" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="175" y="144" text-anchor="middle">TCP · order and reliability</text>
<rect class="lay" x="60" y="158" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="175" y="178" text-anchor="middle">IP</text>

<rect class="lay" x="390" y="56" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="505" y="76" text-anchor="middle">HTTP/3 · streams and frames</text>
<rect class="quic" x="390" y="90" width="230" height="64" rx="6" stroke-width="0.5"/>
<text class="quict" x="505" y="112" text-anchor="middle">QUIC</text>
<text class="quict" x="505" y="132" text-anchor="middle">TLS 1.3 + per-stream reliability</text>
<rect class="lay" x="390" y="158" width="230" height="30" rx="6" stroke-width="0.5"/>
<text class="layt" x="505" y="178" text-anchor="middle">UDP · then IP</text>

<text class="ts" x="175" y="210" text-anchor="middle">three separate handshakes to coordinate</text>
<text class="ts" x="505" y="210" text-anchor="middle">one handshake does transport and crypto</text>

<rect class="panel" x="40" y="226" width="600" height="70" rx="8"/>
<text class="tp" x="60" y="250">setup cost to first byte</text>
<text class="m" x="60" y="276">TCP + TLS 1.3 · 2 round trips</text>
<text class="m" x="360" y="276">QUIC · 1 round trip, or 0 when resuming</text>

<rect class="panel" x="40" y="308" width="600" height="76" rx="8"/>
<text class="tp" x="60" y="332">you walk out of wifi range, onto mobile data</text>
<text class="m" x="60" y="358" opacity="0">your address changes: 192.168.0.11  →  100.64.7.9
<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.35" dur="12s" repeatCount="indefinite"/></text>
<text class="tb" x="60" y="358" opacity="1">on the same network, both are fine
<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.35" dur="12s" repeatCount="indefinite"/></text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.5" dur="12s" repeatCount="indefinite"/>
<rect class="badp" x="360" y="340" width="120" height="26" rx="13" stroke-width="0.5"/>
<text class="badt" x="420" y="357" text-anchor="middle">TCP · dropped</text>
<rect class="okp" x="495" y="340" width="130" height="26" rx="13" stroke-width="0.5"/>
<text class="okt" x="560" y="357" text-anchor="middle">QUIC · survives</text></g>
<text class="ts" x="340" y="392" text-anchor="middle">TCP is identified by the five-tuple, so a new address is a new connection · QUIC is identified by a connection ID that travels with you</text>
</svg>
