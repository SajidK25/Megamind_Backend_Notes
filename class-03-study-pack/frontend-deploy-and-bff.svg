<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>One deploy or two, and the backend-for-frontend</title>
<desc>On the left, one app on product.com serves both the page and the data, so the browser stays on one origin. On the right, a frontend on product.com and an API on api.product.com sit either side of an origin boundary, where CORS applies and a cookie does not travel by default. Below, a browser calls a web backend-for-frontend and a phone calls a mobile backend-for-frontend, both fanning out to the same orders, billing and users services and trimming the response to the shape each screen needs.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#3C3489}
.th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.ml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5F5E5A}
.mw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#B3451F}
.mg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#085041}
.hostbox{fill:#EEEDFE;stroke:#7F77DD}
.rtbox{fill:#F1EFE8;stroke:#888780}
.svbox{fill:#E1F5EE;stroke:#1D9E75}
.wire{stroke:#B4B2A9}
.bound{stroke:#D85A30}
.panel{fill:#F1EFE8}
@media (prefers-color-scheme:dark){
.t{fill:#CECBF6}.th{fill:#EDEDE8}.ts{fill:#B4B2A9}.ml{fill:#B4B2A9}.mw{fill:#EE9A6E}.mg{fill:#5DCAA5}
.hostbox{fill:#3C3489;stroke:#AFA9EC}.rtbox{fill:#2C2C2A;stroke:#B4B2A9}.svbox{fill:#085041;stroke:#5DCAA5}
.wire{stroke:#5F5E5A}.bound{stroke:#EE9A6E}.panel{fill:#262624}}
</style>

<text class="th" x="24" y="26">Together · one deploy</text>
<rect class="hostbox" x="24" y="40" width="120" height="46" rx="8" stroke-width="0.5"/>
<text class="t" x="84" y="68" text-anchor="middle">Browser</text>
<line x1="84" y1="86" x2="84" y2="112" class="wire" stroke-width="0.5"/>
<rect class="rtbox" x="24" y="112" width="120" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="84" y="134" text-anchor="middle">One app</text>
<text class="ml" x="84" y="152" text-anchor="middle">product.com</text>
<text class="mg" x="24" y="184">page and data · same origin</text>
<text class="ts" x="24" y="202">cookie travels · no CORS</text>

<line x1="216" y1="30" x2="216" y2="210" class="wire" stroke-width="0.5"/>

<text class="th" x="252" y="26">Apart · two deploys</text>
<rect class="hostbox" x="252" y="40" width="120" height="46" rx="8" stroke-width="0.5"/>
<text class="t" x="312" y="68" text-anchor="middle">Browser</text>
<line x1="292" y1="86" x2="292" y2="112" class="wire" stroke-width="0.5"/>
<path d="M340 86 L432 112" class="wire" stroke-width="0.5" fill="none"/>

<rect class="rtbox" x="232" y="112" width="120" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="292" y="134" text-anchor="middle">Frontend</text>
<text class="ml" x="292" y="152" text-anchor="middle">product.com</text>

<rect class="svbox" x="392" y="112" width="120" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="452" y="134" text-anchor="middle">API</text>
<text class="ml" x="452" y="152" text-anchor="middle">api.product.com</text>

<line x1="372" y1="96" x2="372" y2="176" class="bound" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="mw" x="378" y="182">origin boundary</text>

<rect class="panel" x="524" y="96" width="132" height="112" rx="10"/>
<text class="th" x="538" y="120">What it costs</text>
<text class="ts" x="538" y="142">CORS on every call</text>
<text class="ts" x="538" y="160">cookie must be told</text>
<text class="ts" x="538" y="178">to travel, or a token</text>
<text class="ts" x="538" y="196">two versions in flight</text>

<line x1="24" y1="228" x2="656" y2="228" class="wire" stroke-width="0.5" stroke-dasharray="3 4"/>

<text class="th" x="24" y="254">A BFF is one backend per frontend</text>

<rect class="hostbox" x="24" y="270" width="104" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="76" y="297" text-anchor="middle">Browser</text>
<rect class="hostbox" x="24" y="336" width="104" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="76" y="363" text-anchor="middle">Phone app</text>

<line x1="128" y1="292" x2="188" y2="292" class="wire" stroke-width="0.5"/>
<line x1="128" y1="358" x2="188" y2="358" class="wire" stroke-width="0.5"/>

<rect class="rtbox" x="188" y="270" width="120" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="248" y="297" text-anchor="middle">Web BFF</text>
<rect class="rtbox" x="188" y="336" width="120" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="248" y="363" text-anchor="middle">Mobile BFF</text>

<path d="M308 292 L392 316" class="wire" stroke-width="0.5" fill="none"/>
<path d="M308 358 L392 334" class="wire" stroke-width="0.5" fill="none"/>

<rect class="svbox" x="392" y="286" width="120" height="78" rx="8" stroke-width="0.5"/>
<text class="t" x="452" y="310" text-anchor="middle">orders</text>
<text class="t" x="452" y="331" text-anchor="middle">billing</text>
<text class="t" x="452" y="352" text-anchor="middle">users</text>

<rect class="panel" x="528" y="270" width="128" height="110" rx="10"/>
<text class="th" x="542" y="294">Each BFF keeps</text>
<text class="ts" x="542" y="316">what its screen needs</text>
<text class="ts" x="542" y="334">and drops the rest.</text>
<text class="ts" x="542" y="358">The team that owns</text>
<text class="ts" x="542" y="374">the screen owns it.</text>

<g>
  <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
    keyTimes="0;0.45;0.55;1" values="384,308; 316,290; 316,290; 130,286"/>
  <rect x="0" y="0" width="34" height="14" rx="4" fill="#5DCAA5" stroke="#1D9E75" stroke-width="0.5"/>
</g>
<g>
  <animateTransform attributeName="transform" type="translate" dur="5s" begin="1.4s" repeatCount="indefinite"
    keyTimes="0;0.45;0.55;1" values="384,326; 316,352; 316,352; 130,352"/>
  <rect x="0" y="0" width="34" height="14" rx="4" fill="#5DCAA5" stroke="#1D9E75" stroke-width="0.5">
    <animate attributeName="width" values="34;34;18;18" keyTimes="0;0.45;0.55;1" dur="5s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
