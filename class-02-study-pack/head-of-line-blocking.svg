<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img">
<title>What one lost packet costs, in each HTTP version</title>
<desc>Under HTTP/1.1 everything queued behind the loss waits. Under HTTP/2 all multiplexed streams wait because TCP holds the bytes back. Under HTTP/3 only the stream that lost a packet waits.</desc>
<style>
.ts{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#5F5E5A}
.tb{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#2C2C2A}
.tp{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;font-weight:500;fill:#993C1D}
.mv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#5F5E5A}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5F5E5A}
.pill{fill:none;stroke:#B4B2A9}
.hl{fill:#EEEDFE;stroke:#7F77DD}
.pk{fill:#E1F5EE;stroke:#1D9E75}
.lost{fill:#FCEBEB;stroke:#E24B4A}
.wait{fill:none;stroke:#B4B2A9}
.okp{fill:#EAF3DE;stroke:#639922}.okt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3B6D11}
.badp{fill:#FCEBEB;stroke:#E24B4A}.badt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#A32D2D}
.x{stroke:#E24B4A}
@media (prefers-color-scheme:dark){
.ts{fill:#B4B2A9}.tb{fill:#EDEDE8}.tp{fill:#F0997B}.mv{fill:#B4B2A9}.m{fill:#B4B2A9}
.pill{stroke:#5F5E5A}.hl{fill:#3C3489;stroke:#AFA9EC}
.pk{fill:#085041;stroke:#5DCAA5}.lost{fill:#791F1F;stroke:#F09595}.wait{stroke:#5F5E5A}
.okp{fill:#27500A;stroke:#97C459}.okt{fill:#C0DD97}.badp{fill:#791F1F;stroke:#F09595}.badt{fill:#F7C1C1}
.x{stroke:#F09595}}
</style>

<rect class="pill" x="90" y="34" width="150" height="36" rx="18" stroke-width="0.5"/>
<rect class="pill" x="265" y="34" width="150" height="36" rx="18" stroke-width="0.5"/>
<rect class="pill" x="440" y="34" width="150" height="36" rx="18" stroke-width="0.5"/>
<rect class="hl" x="90" y="34" width="150" height="36" rx="18" stroke-width="1.5">
<animate attributeName="x" calcMode="discrete" values="90;265;440" keyTimes="0;0.34;0.67" dur="18s" repeatCount="indefinite"/></rect>
<text class="mv" x="165" y="57" text-anchor="middle">HTTP/1.1</text>
<text class="mv" x="340" y="57" text-anchor="middle">HTTP/2</text>
<text class="mv" x="515" y="57" text-anchor="middle">HTTP/3</text>

<text class="m" x="104" y="136" text-anchor="end">html</text>
<text class="m" x="104" y="176" text-anchor="end">css</text>
<text class="m" x="104" y="216" text-anchor="end">image</text>
<text class="ts" x="340" y="252" text-anchor="middle">one packet is dropped on the way</text>

<g>
<rect class="pk" x="120" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="lost" x="170" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<line class="x" x1="178" y1="126" x2="202" y2="136" stroke-width="1.5"/>
<line class="x" x1="202" y1="126" x2="178" y2="136" stroke-width="1.5"/>
<rect class="wait" x="220" y="120" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="wait" x="270" y="120" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="wait" x="120" y="160" width="190" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="wait" x="120" y="200" width="190" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="badp" x="330" y="118" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="135" text-anchor="middle">waiting</text>
<rect class="badp" x="330" y="158" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="175" text-anchor="middle">not even started</text>
<rect class="badp" x="330" y="198" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="215" text-anchor="middle">not even started</text>
<text class="tp" x="60" y="292">One request at a time, so there is nothing to block — there is only a queue.</text>
<text class="tb" x="60" y="314">The css and image have not been asked for yet. The loss delays the whole page.</text>
<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.34" dur="18s" repeatCount="indefinite"/></g>

<g opacity="0">
<rect class="pk" x="120" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="lost" x="170" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<line class="x" x1="178" y1="126" x2="202" y2="136" stroke-width="1.5"/>
<line class="x" x1="202" y1="126" x2="178" y2="136" stroke-width="1.5"/>
<rect class="wait" x="220" y="120" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="pk" x="120" y="160" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="170" y="160" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="wait" x="220" y="160" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="pk" x="120" y="200" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="170" y="200" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="wait" x="220" y="200" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="badp" x="330" y="118" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="135" text-anchor="middle">waiting</text>
<rect class="badp" x="330" y="158" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="175" text-anchor="middle">arrived, held back</text>
<rect class="badp" x="330" y="198" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="215" text-anchor="middle">arrived, held back</text>
<text class="tp" x="60" y="292">All three share one TCP connection, and TCP will not skip a missing byte.</text>
<text class="tb" x="60" y="314">The css and image are already on the machine — TCP just refuses to hand them up.</text>
<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.34;0.67" dur="18s" repeatCount="indefinite"/></g>

<g opacity="0">
<rect class="pk" x="120" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="lost" x="170" y="120" width="40" height="22" rx="4" stroke-width="0.5"/>
<line class="x" x1="178" y1="126" x2="202" y2="136" stroke-width="1.5"/>
<line class="x" x1="202" y1="126" x2="178" y2="136" stroke-width="1.5"/>
<rect class="wait" x="220" y="120" width="40" height="22" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="pk" x="120" y="160" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="170" y="160" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="220" y="160" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="120" y="200" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="170" y="200" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="pk" x="220" y="200" width="40" height="22" rx="4" stroke-width="0.5"/>
<rect class="badp" x="330" y="118" width="120" height="26" rx="13" stroke-width="0.5"/><text class="badt" x="390" y="135" text-anchor="middle">waiting</text>
<rect class="okp" x="330" y="158" width="120" height="26" rx="13" stroke-width="0.5"/><text class="okt" x="390" y="175" text-anchor="middle">delivered</text>
<rect class="okp" x="330" y="198" width="120" height="26" rx="13" stroke-width="0.5"/><text class="okt" x="390" y="215" text-anchor="middle">delivered</text>
<text class="tp" x="60" y="292">QUIC tracks loss per stream, so only the stream that lost a packet waits.</text>
<text class="tb" x="60" y="314">The page renders while the one damaged response is quietly retransmitted.</text>
<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.67" dur="18s" repeatCount="indefinite"/></g>

<text class="ts" x="340" y="344" text-anchor="middle">green = arrived · dashed = still waiting · red = the dropped packet</text>
</svg>
