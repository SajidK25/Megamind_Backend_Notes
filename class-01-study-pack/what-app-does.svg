<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #33322e; stroke-width: 1.5; }
    .sub { font-size: 13px; fill: #33322e; }
    .accent { font-size: 12px; fill: #d97a3b; }
    .num { font-size: 13px; fill: #d97a3b; font-weight: bold; }
  </style>
  <rect class="box" x="30" y="20" width="640" height="40" rx="6"/>
  <text class="num" x="45" y="45">1</text>
  <text class="sub" x="70" y="45">Who is asking?</text>
  <text class="accent" x="220" y="45">authentication</text>

  <rect class="box" x="30" y="70" width="640" height="40" rx="6"/>
  <text class="num" x="45" y="95">2</text>
  <text class="sub" x="70" y="95">Are they allowed?</text>
  <text class="accent" x="220" y="95">authorization</text>

  <rect class="box" x="30" y="120" width="640" height="40" rx="6"/>
  <text class="num" x="45" y="145">3</text>
  <text class="sub" x="70" y="145">Does the request make sense?</text>
  <text class="accent" x="320" y="145">validation</text>

  <rect class="box" x="30" y="170" width="640" height="40" rx="6"/>
  <text class="num" x="45" y="195">4</text>
  <text class="sub" x="70" y="195">Do the work.</text>

  <rect class="box" x="30" y="220" width="640" height="40" rx="6"/>
  <text class="num" x="45" y="245">5</text>
  <text class="sub" x="70" y="245">Send back an answer.</text>

  <text class="sub" x="30" y="285" font-size="12" fill="#6b6a66">Steps 1–3 are only checks — usually more code than step 4.</text>
</svg>
