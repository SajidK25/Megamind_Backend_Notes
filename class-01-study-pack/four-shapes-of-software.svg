<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #33322e; stroke-width: 2; rx: 8; }
    .title { font-size: 18px; font-weight: bold; fill: #33322e; }
    .sub { font-size: 13px; fill: #6b6a66; }
    .eg { font-size: 12px; fill: #d97a3b; }
  </style>
  <g>
    <rect class="box" x="20" y="20" width="200" height="200"/>
    <text class="title" x="35" y="55">Web</text>
    <text class="sub" x="35" y="85">Runs in a browser.</text>
    <text class="sub" x="35" y="105">Nothing to install,</text>
    <text class="sub" x="35" y="125">updates on deploy.</text>
    <text class="eg" x="35" y="195">Gmail · Figma</text>
  </g>
  <g>
    <rect class="box" x="240" y="20" width="200" height="200"/>
    <text class="title" x="255" y="55">Mobile</text>
    <text class="sub" x="255" y="85">Installed via a store.</text>
    <text class="sub" x="255" y="105">Updates are slow</text>
    <text class="sub" x="255" y="125">and optional.</text>
    <text class="eg" x="255" y="195">WhatsApp · Uber</text>
  </g>
  <g>
    <rect class="box" x="460" y="20" width="200" height="200"/>
    <text class="title" x="475" y="55">Desktop</text>
    <text class="sub" x="475" y="85">Installed on a computer.</text>
    <text class="sub" x="475" y="105">Real access to files</text>
    <text class="sub" x="475" y="125">and hardware.</text>
    <text class="eg" x="475" y="195">VS Code · Photoshop</text>
  </g>
  <g>
    <rect class="box" x="680" y="20" width="200" height="200"/>
    <text class="title" x="695" y="55">Device / IoT</text>
    <text class="sub" x="695" y="85">A thing with a chip in it.</text>
    <text class="sub" x="695" y="105">Tiny screen or none,</text>
    <text class="sub" x="695" y="125">flaky network.</text>
    <text class="eg" x="695" y="195">Smart bulb · Car</text>
  </g>
</svg>
