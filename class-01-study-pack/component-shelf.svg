<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #33322e; stroke-width: 1.5; }
    .title { font-size: 13px; font-weight: bold; fill: #33322e; }
    .sub { font-size: 10.5px; fill: #6b6a66; }
  </style>
  <!-- row 1 -->
  <rect class="box" x="20" y="20" width="200" height="110" rx="6"/>
  <text class="title" x="35" y="45">Web server</text>
  <text class="sub" x="35" y="68">Answers the door,</text>
  <text class="sub" x="35" y="84">hands it inward.</text>

  <rect class="box" x="240" y="20" width="200" height="110" rx="6"/>
  <text class="title" x="255" y="45">Application</text>
  <text class="sub" x="255" y="68">Our rules.</text>
  <text class="sub" x="255" y="84">The part we write.</text>

  <rect class="box" x="460" y="20" width="200" height="110" rx="6"/>
  <text class="title" x="475" y="45">Database</text>
  <text class="sub" x="475" y="68">The memory.</text>
  <text class="sub" x="475" y="84">Survives restarts.</text>

  <rect class="box" x="680" y="20" width="200" height="110" rx="6"/>
  <text class="title" x="695" y="45">File storage</text>
  <text class="sub" x="695" y="68">Big things — photos,</text>
  <text class="sub" x="695" y="84">video, PDFs.</text>

  <!-- row 2 -->
  <rect class="box" x="20" y="150" width="200" height="110" rx="6"/>
  <text class="title" x="35" y="175">Cache</text>
  <text class="sub" x="35" y="198">Fast copy of an</text>
  <text class="sub" x="35" y="214">answer already found.</text>

  <rect class="box" x="240" y="150" width="200" height="110" rx="6"/>
  <text class="title" x="255" y="175">Queue + workers</text>
  <text class="sub" x="255" y="198">Jobs too slow to</text>
  <text class="sub" x="255" y="214">make someone wait for.</text>

  <rect class="box" x="460" y="150" width="200" height="110" rx="6"/>
  <text class="title" x="475" y="175">Scheduler</text>
  <text class="sub" x="475" y="198">Jobs nobody asked for,</text>
  <text class="sub" x="475" y="214">run at 3am anyway.</text>

  <rect class="box" x="680" y="150" width="200" height="110" rx="6"/>
  <text class="title" x="695" y="175">External services</text>
  <text class="sub" x="695" y="198">Email, payments, maps.</text>
  <text class="sub" x="695" y="214">Other people's backends.</text>
</svg>
